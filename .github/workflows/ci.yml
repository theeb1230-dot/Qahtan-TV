name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: P0 runtime evidence - Akwam
        run: npm run e2e:provider -- akwam "مسلسل"
      - name: P0 runtime evidence - Yacine TV
        run: npm run e2e:provider -- yacinetv "رياضة"
      - name: P0 runtime evidence - WeCima degraded contract
        env:
          EXPECT_DEGRADED_REASON: cloudflare-challenge
        run: npm run e2e:provider -- wecima "مسلسل"
      # ArabSeed and FaselHD are independent P0 runtime proofs. Collect both
      # results in every run so one external/provider failure cannot hide the
      # other provider's evidence. The final aggregate step remains strict:
      # either failure keeps CI red, so continue-on-error here is not a waiver.
      - name: P0 runtime evidence - ArabSeed
        id: arabseed_runtime
        continue-on-error: true
        run: npm run e2e:provider -- arabseed "Best of the Best"
      - name: P0 runtime evidence - FaselHD
        id: faselhd_runtime
        continue-on-error: true
        run: npm run e2e:provider -- faselhd "مسلسل"
      - name: P0 runtime evidence - aggregate strict gate
        if: always()
        env:
          ARABSEED_OUTCOME: ${{ steps.arabseed_runtime.outcome }}
          FASELHD_OUTCOME: ${{ steps.faselhd_runtime.outcome }}
        run: |
          echo "ArabSeed runtime outcome: ${ARABSEED_OUTCOME}"
          echo "FaselHD runtime outcome: ${FASELHD_OUTCOME}"
          test "${ARABSEED_OUTCOME}" = "success"
          test "${FASELHD_OUTCOME}" = "success"
