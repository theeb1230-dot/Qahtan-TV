name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: P0 runtime evidence - Akwam
        run: npm run e2e:provider -- akwam "مسلسل"
      - name: P0 runtime evidence - Yacine TV
        run: npm run e2e:provider -- yacinetv "رياضة"
      - name: P0 runtime evidence - WeCima degraded contract
        env:
          EXPECT_DEGRADED_REASON: cloudflare-challenge
        run: npm run e2e:provider -- wecima "مسلسل"
      # Collect provider outcomes independently so one failure never hides the
      # next provider. Strict require steps below keep every acceptance gate red
      # unless its real end-to-end runtime path succeeds.
      - name: P0 runtime evidence - ArabSeed
        id: arabseed_runtime
        continue-on-error: true
        run: npm run e2e:provider -- arabseed "Best of the Best"
      - name: P0 runtime evidence - FaselHD
        id: faselhd_runtime
        continue-on-error: true
        run: npm run e2e:provider -- faselhd "مسلسل"
      - name: P0 runtime evidence - Anime4Up
        id: anime4up_runtime
        continue-on-error: true
        # The current first-party landing page exposes One Piece canonically in
        # Latin form. Keep the gate deterministic while still requiring the full
        # search -> meta -> episodes -> safe stream runtime path.
        run: npm run e2e:provider -- anime4up "One Piece"
      - name: P0 runtime evidence - WitAnime
        id: witanime_runtime
        continue-on-error: true
        run: npm run e2e:provider -- witanime "ون بيس"
      - name: P0 runtime evidence - 3isk
        id: threeisk_runtime
        continue-on-error: true
        run: npm run e2e:provider -- 3isk "مسلسل"
      - name: P0 runtime evidence - EgyDead
        id: egydead_runtime
        continue-on-error: true
        run: npm run e2e:provider -- egydead "مسلسل"
      - name: P0 require ArabSeed runtime success
        if: always()
        env:
          PROVIDER_OUTCOME: ${{ steps.arabseed_runtime.outcome }}
        run: |
          echo "ArabSeed runtime outcome: ${PROVIDER_OUTCOME}"
          test "${PROVIDER_OUTCOME}" = "success"
      - name: P0 require FaselHD runtime success
        if: always()
        env:
          PROVIDER_OUTCOME: ${{ steps.faselhd_runtime.outcome }}
        run: |
          echo "FaselHD runtime outcome: ${PROVIDER_OUTCOME}"
          test "${PROVIDER_OUTCOME}" = "success"
      - name: P0 require Anime4Up runtime success
        if: always()
        env:
          PROVIDER_OUTCOME: ${{ steps.anime4up_runtime.outcome }}
        run: |
          echo "Anime4Up runtime outcome: ${PROVIDER_OUTCOME}"
          test "${PROVIDER_OUTCOME}" = "success"
      - name: P0 require WitAnime runtime success
        if: always()
        env:
          PROVIDER_OUTCOME: ${{ steps.witanime_runtime.outcome }}
        run: |
          echo "WitAnime runtime outcome: ${PROVIDER_OUTCOME}"
          test "${PROVIDER_OUTCOME}" = "success"
      - name: P0 require 3isk runtime success
        if: always()
        env:
          PROVIDER_OUTCOME: ${{ steps.threeisk_runtime.outcome }}
        run: |
          echo "3isk runtime outcome: ${PROVIDER_OUTCOME}"
          test "${PROVIDER_OUTCOME}" = "success"
      - name: P0 require EgyDead runtime success
        if: always()
        env:
          PROVIDER_OUTCOME: ${{ steps.egydead_runtime.outcome }}
        run: |
          echo "EgyDead runtime outcome: ${PROVIDER_OUTCOME}"
          test "${PROVIDER_OUTCOME}" = "success"
