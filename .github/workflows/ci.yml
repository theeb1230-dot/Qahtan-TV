name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: P0 runtime evidence - Akwam
        run: npm run e2e:provider -- akwam "مسلسل"
      - name: P0 runtime evidence - Yacine TV
        run: npm run e2e:provider -- yacinetv "رياضة"
      - name: P0 runtime evidence - WeCima degraded contract
        env:
          EXPECT_DEGRADED_REASON: cloudflare-challenge
        run: npm run e2e:provider -- wecima "مسلسل"
      # FaselHD is currently hard-blocked by an external 403 on both verified
      # canonical origins from hosted CI. Keep its strict gate, but run the next
      # independent provider proof first so the blocked origin does not hide
      # actionable ArabSeed runtime regressions.
      # This title is currently present on ArabSeed's first-party catalog surface.
      # Search/catalog/meta/stream acceptance remains strict; this is not a fixture.
      - name: P0 runtime evidence - ArabSeed
        run: npm run e2e:provider -- arabseed "Best of the Best"
      - name: P0 runtime evidence - FaselHD
        run: npm run e2e:provider -- faselhd "مسلسل"
